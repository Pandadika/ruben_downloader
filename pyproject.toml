[project]
name = "ruben-downloader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Derp Derpson", email = "dderpson99@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

[project.scripts]
ruben-downloader = "ruben_downloader:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
